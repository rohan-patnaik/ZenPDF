services:
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL:?Set NEXT_PUBLIC_CONVEX_URL before building}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY before building}
    env_file:
      - ./apps/web/.env.local
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - worker

  worker:
    build:
      context: ./apps/worker
    env_file:
      - ./apps/worker/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - worker-upload-recovery:/var/lib/zenpdf-worker

volumes:
  worker-upload-recovery:
