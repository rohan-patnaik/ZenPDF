name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  omarchy-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Omarchy launcher
        run: python3 scripts/validate_omarchy_plugin.py
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Integration tests
        run: npm run test:integration
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/worker/requirements-dev.txt
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: pytest -v --tb=short
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned Qt SDK
        timeout-minutes: 8
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: "6.7.3"
          modules: "qtpdf"
          cache: true
          cache-key-prefix: "zenpdf-qt-6.7.3"
          install-deps: false
          aqtversion: "==3.2.1"
          py7zrversion: "==0.22.0"
      - name: Install pinned qpdf
        timeout-minutes: 3
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/qpdf-12.4.0-bin-linux-x86_64.zip"
          destination="$RUNNER_TEMP/qpdf-12.4.0"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            --output "$archive" \
            https://github.com/qpdf/qpdf/releases/download/v12.4.0/qpdf-12.4.0-bin-linux-x86_64.zip
          echo "a3bca240f3bb61efdc3a90be89d1da4ed5e125326c3458c4e62df53ff4f153e3  $archive" | sha256sum --check --strict
          mkdir "$destination"
          unzip -q "$archive" -d "$destination"
          qpdf_bin="$(find "$destination" -type f -path '*/bin/qpdf' -print -quit)"
          test -n "$qpdf_bin"
          chmod +x "$qpdf_bin"
          echo "$(dirname "$qpdf_bin")" >> "$GITHUB_PATH"
      - name: Install pinned native headers
        timeout-minutes: 2
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/libgl-dev_1.7.0-1build1_amd64.deb"
          destination="$RUNNER_TEMP/opengl-dev"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --connect-timeout 20 --max-time 60 \
            --output "$package" \
            https://security.ubuntu.com/ubuntu/pool/main/libg/libglvnd/libgl-dev_1.7.0-1build1_amd64.deb
          echo "b7145fd8f8abe20d5cb436d2eae9b3235bd91be6fbddac581620d16763bd9250  $package" | sha256sum --check --strict
          mkdir "$destination"
          dpkg-deb --extract "$package" "$destination"
          test -r "$destination/usr/include/GL/gl.h"
          test -r /usr/lib/x86_64-linux-gnu/libGL.so.1
          echo "ZENPDF_OPENGL_INCLUDE=$destination/usr/include" >> "$GITHUB_ENV"
          package="$RUNNER_TEMP/libcups2-dev_2.4.7-1.2ubuntu7.14_amd64.deb"
          destination="$RUNNER_TEMP/cups-dev"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --connect-timeout 20 --max-time 60 \
            --output "$package" \
            https://security.ubuntu.com/ubuntu/pool/main/c/cups/libcups2-dev_2.4.7-1.2ubuntu7.14_amd64.deb
          echo "f2c4a43590f2784ac05dadb8522b6cd47c33f7ba0eba258661897ccf53dcb093  $package" | sha256sum --check --strict
          mkdir "$destination"
          dpkg-deb --extract "$package" "$destination"
          test -r "$destination/usr/include/cups/cups.h"
          test -r /usr/lib/x86_64-linux-gnu/libcups.so.2
          echo "ZENPDF_CUPS_INCLUDE=$destination/usr/include" >> "$GITHUB_ENV"
      - name: Verify native toolchain
        timeout-minutes: 1
        run: |
          cmake --version
          ninja --version
          g++ --version
          qpdf --version
      - name: Configure
        timeout-minutes: 3
        run: >-
          cmake -S apps/desktop -B build/desktop -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DOpenGL_GL_PREFERENCE=LEGACY
          -DOPENGL_INCLUDE_DIR="$ZENPDF_OPENGL_INCLUDE"
          -DOPENGL_gl_LIBRARY=/usr/lib/x86_64-linux-gnu/libGL.so.1
          -DCUPS_INCLUDE_DIR="$ZENPDF_CUPS_INCLUDE"
          -DCUPS_LIBRARIES=/usr/lib/x86_64-linux-gnu/libcups.so.2
      - name: Build
        timeout-minutes: 5
        run: cmake --build build/desktop --parallel 2
      - name: Test
        timeout-minutes: 5
        run: ctest --test-dir build/desktop --output-on-failure
