name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CHECKOUT_ACTION_SHA: 11d5960a326750d5838078e36cf38b85af677262

jobs:
  governance:
    runs-on: ubuntu-24.04
    container:
      image: python:3.11.13-slim-bookworm@sha256:86adf8dbadc3d6e82ee5dd2c74bec2e1c2467cdad47886280501df722372d2e1
    timeout-minutes: 5
    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate contracts
        timeout-minutes: 2
        run: |
          python3 scripts/validate_omarchy_plugin.py
          python3 scripts/validate_desktop_governance.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

  web:
    runs-on: ubuntu-24.04
    container:
      image: node:20.19.4-bookworm-slim@sha256:6db5e436948af8f0244488a1f658c2c8e55a3ae51ca2e1686ed042be8f25f70a
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIuZXhhbXBsZS5jb20k
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install locked dependencies
        timeout-minutes: 5
        run: npm ci --ignore-scripts=false --no-audit --no-fund
      - name: Lint
        timeout-minutes: 3
        run: npm run lint
      - name: Unit tests
        timeout-minutes: 3
        run: npm run test
      - name: Integration tests
        timeout-minutes: 3
        run: npm run test:integration
      - name: Production build
        timeout-minutes: 5
        run: npm run build

  worker:
    runs-on: ubuntu-24.04
    container:
      image: python:3.11.13-slim-bookworm@sha256:86adf8dbadc3d6e82ee5dd2c74bec2e1c2467cdad47886280501df722372d2e1
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install hashed dependencies
        timeout-minutes: 8
        run: >-
          python3 -m pip install --disable-pip-version-check
          --require-hashes --retries 3 --timeout 20
          -r requirements-ci.lock
      - name: Tests
        timeout-minutes: 5
        run: python3 -m pytest -v --tb=short

  desktop-arch-package:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel-20260816.0.574111@sha256:714acd1eef9ae997d95691b1c5220ada0076185b77857c1813f02de0fa83cf7b
    timeout-minutes: 30
    env:
      ARCH_SNAPSHOT: "2026/08/17"
    steps:
      - name: Install snapshot toolchain
        timeout-minutes: 8
        run: |
          set -euo pipefail
          printf 'Server = https://archive.archlinux.org/repos/%s/$repo/os/$arch\n' \
            "$ARCH_SNAPSHOT" > /etc/pacman.d/mirrorlist
          pacman -Syyu --noconfirm --needed \
            git cmake ninja qpdf qt6-base qt6-webengine
          pacman -Q git cmake ninja qpdf qt6-base qt6-webengine
      - name: Checkout exact revision
        timeout-minutes: 2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify exact toolchain
        timeout-minutes: 1
        run: |
          set -euo pipefail
          cd /var/cache/pacman/pkg
          sha256sum --check \
            "$GITHUB_WORKSPACE/apps/desktop/ci/arch-packages.sha256"
          cd "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(pacman -Q git)" = "git 2.55.0-1"
          test "$(pacman -Q cmake)" = "cmake 4.4.2-1"
          test "$(pacman -Q ninja)" = "ninja 1.13.2-3"
          test "$(pacman -Q qpdf)" = "qpdf 12.3.2-2"
          test "$(pacman -Q qt6-base)" = "qt6-base 6.11.1-1"
          test "$(pacman -Q qt6-webengine)" = "qt6-webengine 6.11.1-5"
      - name: Configure native application
        timeout-minutes: 3
        run: >-
          cmake -S apps/desktop -B build/desktop -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
      - name: Build native application
        timeout-minutes: 8
        run: cmake --build build/desktop --parallel 2
      - name: Run complete native CTest
        timeout-minutes: 5
        run: ctest --test-dir build/desktop --output-on-failure
      - name: Build exact-revision Arch package
        timeout-minutes: 10
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          source_root=$(mktemp -d)
          mkdir "$source_root/ZenPDF"
          git archive "$GITHUB_SHA" | tar -x -C "$source_root/ZenPDF"
          printf '%s\n' "$GITHUB_SHA" > \
            "$source_root/ZenPDF/.zenpdf-source-revision"
          source_archive="zenpdf-source-$GITHUB_SHA.tar.gz"
          tar -C "$source_root" -czf \
            "apps/desktop/packaging/arch/$source_archive" ZenPDF
          useradd --create-home package-builder
          chown -R package-builder:package-builder apps/desktop/packaging/arch
          runuser -u package-builder -- env \
            ZENPDF_SOURCE_ARCHIVE="$source_archive" \
            ZENPDF_EXPECTED_REVISION="$GITHUB_SHA" sh -c \
            'cd apps/desktop/packaging/arch && makepkg --cleanbuild --clean --noconfirm'
          package_count=$(find apps/desktop/packaging/arch -maxdepth 1 -type f \
            -name 'zenpdf-git-*.pkg.tar.zst' ! -name '*-debug-*' | wc -l)
          test "$package_count" -eq 1
          package_path=$(find apps/desktop/packaging/arch -maxdepth 1 -type f \
            -name 'zenpdf-git-*.pkg.tar.zst' ! -name '*-debug-*' -print -quit)
          package_info=$(pacman -Qip "$package_path")
          printf '%s\n' "$package_info"
          package_version=$(printf '%s\n' "$package_info" | sed -n 's/^Version *: *//p')
          short_sha=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          test "$package_version" = "0.1.0.r0.g$short_sha-1"
          pacman -U --noconfirm "$package_path"
          test -x /usr/bin/zenpdf
          pacman -Q zenpdf-git
